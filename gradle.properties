org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# The version a release is cut from. Gradle reads these properties directly, and the release
# pipeline reads this file rather than the Kotlin build script, so the two cannot drift apart
# when the build script is refactored.
hydraboxVersionCode=201
hydraboxVersionName=2.0.0-alpha2
