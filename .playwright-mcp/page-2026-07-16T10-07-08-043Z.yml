            - heading "DNS, правила и защита от обхода" [level=2] [ref=f2e319]
            - paragraph [ref=f2e320]: DNS определяет адрес назначения, а правила маршрутизации решают, через какой outbound пойдёт соединение.
          - generic [ref=f2e321]:
            - generic [ref=f2e322]:
              - article [ref=f2e323]:
                - heading "Прямой DNS" [level=3] [ref=f2e324]
                - paragraph [ref=f2e325]: Используется для запросов, которые должны идти через обычную сеть. Доступны DNS устройства, UDP, TCP, DoT и DoH.
