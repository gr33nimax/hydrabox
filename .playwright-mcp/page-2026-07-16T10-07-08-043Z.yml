                - heading "DNS через прокси" [level=3] [ref=f2e327]
                - paragraph [ref=f2e328]: Запросы проходят через выбранный маршрут. DoH часто удобен в сетях, где обычный UDP DNS фильтруется.
              - article [ref=f2e329]:
                - heading "Умная маршрутизация" [level=3] [ref=f2e330]
                - paragraph [ref=f2e331]: Использует локальные наборы правил. Проверяйте статус скачивания и установки данных перед включением.
              - article [ref=f2e332]:
                - heading "AdGuard DNS Filter" [level=3] [ref=f2e333]
                - paragraph [ref=f2e334]: Фильтр компилируется локально. Обновление может занять время и временно использовать больше памяти.
            - generic [ref=f2e335]:
              - strong [ref=f2e336]: Без необходимости оставьте пресеты.
              - paragraph [ref=f2e337]: Собственный DNS полезен при конкретной проблеме. Случайное сочетание прямого DNS и маршрутов может раскрывать назначения или ломать резолвинг.
