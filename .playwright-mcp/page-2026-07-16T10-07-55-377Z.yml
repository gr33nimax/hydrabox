            - heading "DNS, правила и защита от обхода" [level=2] [ref=f3e319]
            - paragraph [ref=f3e320]: DNS определяет адрес назначения, а правила маршрутизации решают, через какой outbound пойдёт соединение.
          - generic [ref=f3e321]:
            - generic [ref=f3e322]:
              - article [ref=f3e323]:
                - heading "Прямой DNS" [level=3] [ref=f3e324]
                - paragraph [ref=f3e325]: Используется для запросов, которые должны идти через обычную сеть. Доступны DNS устройства, UDP, TCP, DoT и DoH.
              - article [ref=f3e326]:
                - heading "DNS через прокси" [level=3] [ref=f3e327]
                - paragraph [ref=f3e328]: Запросы проходят через выбранный маршрут. DoH часто удобен в сетях, где обычный UDP DNS фильтруется.
              - article [ref=f3e329]:
                - heading "Умная маршрутизация" [level=3] [ref=f3e330]
                - paragraph [ref=f3e331]: Использует локальные наборы правил. Проверяйте статус скачивания и установки данных перед включением.
              - article [ref=f3e332]:
                - heading "AdGuard DNS Filter" [level=3] [ref=f3e333]
                - paragraph [ref=f3e334]: Фильтр компилируется локально. Обновление может занять время и временно использовать больше памяти.
            - generic [ref=f3e335]:
              - strong [ref=f3e336]: Без необходимости оставьте пресеты.
              - paragraph [ref=f3e337]: Собственный DNS полезен при конкретной проблеме. Случайное сочетание прямого DNS и маршрутов может раскрывать назначения или ломать резолвинг.
