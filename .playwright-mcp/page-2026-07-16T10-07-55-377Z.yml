                - heading "Нужна подписка" [level=3] [ref=f3e123]
                - paragraph [ref=f3e124]: Приложение не предоставляет серверы. Используйте подписку или конфигурацию, которой вы владеете либо имеете право пользоваться.
              - article [ref=f3e125]:
