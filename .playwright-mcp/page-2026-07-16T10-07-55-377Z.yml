                - heading "Открытый код" [level=3] [ref=f3e127]
                - paragraph [ref=f3e128]: Клиент распространяется по Apache-2.0. Исходники, история изменений и сборки находятся на GitHub.
            - generic [ref=f3e129]:
              - strong [ref=f3e130]: Проект развивается.
