                - heading "Только Android" [level=3] [ref=f3e119]
                - paragraph [ref=f3e120]: Основная платформа — Android 8.0 и новее. Остальные платформенные папки в исходниках пока не являются релизными целями.
              - article [ref=f3e121]:
