                - heading "Самый быстрый" [level=3] [ref=e343]
                - paragraph [ref=e344]: Группа URLTest выбирает доступный сервер с наименьшей измеренной задержкой. Выбор может измениться после новой проверки.
              - article [ref=e345]:
