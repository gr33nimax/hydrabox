                - heading "Умная маршрутизация" [level=3] [ref=e335]
                - paragraph [ref=e336]: Использует локальные наборы правил. Проверяйте статус скачивания и установки данных перед включением.
              - article [ref=e337]:
                - heading "AdGuard DNS Filter" [level=3] [ref=e338]
                - paragraph [ref=e339]: Фильтр компилируется локально. Обновление может занять время и временно использовать больше памяти.
