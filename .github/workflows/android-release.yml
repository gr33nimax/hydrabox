name: HydraBox · Android release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Optional versionName override, for example 0.1.0 or v0.1.0"
        required: false
        type: string
      build_number:
        description: "Optional versionCode override, for example 1"
        required: false
        type: string
      include_private_happ_assets:
        description: "Include inherited private Happ assets only after redistribution rights are verified"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  GO_VERSION: "1.24.6"
  KEYSTORE_PATH: "android/app/hydrabox-release.jks"
  BUILD_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.build_name || '' }}
  BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '' }}
  HYDRACORE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRACORE_RELEASE_PUBLIC_KEYS }}
  HYDRABOX_UPDATE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRABOX_UPDATE_RELEASE_PUBLIC_KEYS }}
  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

jobs:
  build-release-apk:
    name: Build signed APK matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true

      - name: Fetch verified libbox release asset
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify pinned libbox binary
        run: python3 -B scripts/verify_libbox.py

      - name: Resolve release version
        shell: bash
        run: |
          raw="${BUILD_NAME}"
          if [ -z "$raw" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              raw="${GITHUB_REF_NAME}"
            else
              raw="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
            fi
          fi
          raw="${raw#v}"
          if ! [[ "$raw" =~ ^[0-9]+(\.[0-9]+){1,3}([._-][0-9A-Za-z]+)*$ ]]; then
            echo "::error title=Invalid release version::Use 0.1.0 or v0.1.0, got '${raw}'"
            exit 1
          fi
          echo "RELEASE_VERSION=${raw}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${raw}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=v${raw}" >> "$GITHUB_ENV"
          echo "Resolved release: tag=${raw}, title=v${raw}"

      - name: Validate project version metadata
        shell: bash
        run: |
          pubspec_full="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml)"
          pubspec_version="${pubspec_full%%+*}"
          pubspec_code=""
          if [[ "$pubspec_full" == *+* ]]; then
            pubspec_code="${pubspec_full#*+}"
          fi
          if [ "$pubspec_version" != "$RELEASE_VERSION" ]; then
            echo "::error title=Version mismatch::pubspec.yaml has ${pubspec_version}, release input resolved to ${RELEASE_VERSION}"
            exit 1
          fi
          if [ -n "$BUILD_NUMBER" ] && [ -n "$pubspec_code" ] && [ "$BUILD_NUMBER" != "$pubspec_code" ]; then
            echo "::error title=Build number mismatch::pubspec.yaml has +${pubspec_code}, workflow build_number is ${BUILD_NUMBER}"
            exit 1
          fi
          if [ -f android/local.properties ]; then
            local_name="$(awk -F= '/^flutter.versionName=/ {print $2; exit}' android/local.properties)"
            local_code="$(awk -F= '/^flutter.versionCode=/ {print $2; exit}' android/local.properties)"
            if [ -n "$local_name" ] && [ "$local_name" != "$RELEASE_VERSION" ]; then
              echo "::error title=Android local.properties mismatch::flutter.versionName=${local_name}, release=${RELEASE_VERSION}"
              exit 1
            fi
            if [ -n "$BUILD_NUMBER" ] && [ -n "$local_code" ] && [ "$local_code" != "$BUILD_NUMBER" ]; then
              echo "::error title=Android local.properties mismatch::flutter.versionCode=${local_code}, build_number=${BUILD_NUMBER}"
              exit 1
            fi
          fi

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Show tool versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HYDRABOX_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.HYDRABOX_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not configured in repository secrets"
              missing=1
            fi
          done
          if [ -z "${HYDRACORE_RELEASE_PUBLIC_KEYS}" ]; then
            echo "::error title=Missing HydraCore key ring::HYDRACORE_RELEASE_PUBLIC_KEYS repository variable is not configured"
            missing=1
          fi
          if [ -z "${HYDRABOX_UPDATE_RELEASE_PUBLIC_KEYS}" ]; then
            echo "::error title=Missing update key ring::HYDRABOX_UPDATE_RELEASE_PUBLIC_KEYS repository variable is not configured"
            missing=1
          fi
          if [ -z "${HYDRABOX_UPDATE_ED25519_PRIVATE_KEY}" ]; then
            echo "::error title=Missing secret::HYDRABOX_UPDATE_ED25519_PRIVATE_KEY is not configured"
            missing=1
          fi
          if [ -z "${ANDROID_SIGNING_CERT_SHA256}" ]; then
            echo "::error title=Missing signing certificate pin::ANDROID_SIGNING_CERT_SHA256 repository variable is not configured"
            missing=1
          fi
          exit "$missing"

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${KEYSTORE_PATH}"
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/hydrabox-release.jks
          EOF
          chmod 600 "${KEYSTORE_PATH}" android/key.properties

      - name: Restore licensed private Happ crypto assets
        if: ${{ inputs.include_private_happ_assets }}
        shell: bash
        env:
          HAPP_CRYPTO_ASSETS_PASSPHRASE: ${{ secrets.HAPP_CRYPTO_ASSETS_PASSPHRASE }}
        run: |
          if [ -z "${HAPP_CRYPTO_ASSETS_PASSPHRASE}" ]; then
            echo "::error title=Missing secret::HAPP_CRYPTO_ASSETS_PASSPHRASE is not configured"
            exit 1
          fi
          echo "Private Happ assets were explicitly requested. The distributor is responsible for verified redistribution rights."
          encrypted_assets=".github/private/happ_crypto_assets.zip.gpg"
          if [ ! -s "${encrypted_assets}" ]; then
            echo "::error title=Missing encrypted Happ crypto assets::${encrypted_assets} is missing or empty"
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$HAPP_CRYPTO_ASSETS_PASSPHRASE" \
            --output "${tmp_dir}/happ_crypto_assets.zip" \
            --decrypt "${encrypted_assets}"
          unzip -q "${tmp_dir}/happ_crypto_assets.zip" -d "${tmp_dir}/unzipped"
          mkdir -p assets/happ_crypto
          if [ -d "${tmp_dir}/unzipped/assets/happ_crypto" ]; then
            cp -R "${tmp_dir}/unzipped/assets/happ_crypto/." assets/happ_crypto/
          else
            cp -R "${tmp_dir}/unzipped/." assets/happ_crypto/
          fi
          for file in selectors.json expanded_rsa_keys.json crypt51_rsa_keys.json native_rsa_keys.json; do
            if [ ! -s "assets/happ_crypto/${file}" ]; then
              echo "::error title=Missing Happ crypto asset::assets/happ_crypto/${file} is missing or empty"
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text(encoding="utf-8").splitlines()
          entries = [
              "    - assets/happ_crypto/crypt51_rsa_keys.json",
              "    - assets/happ_crypto/expanded_rsa_keys.json",
              "    - assets/happ_crypto/native_rsa_keys.json",
              "    - assets/happ_crypto/selectors.json",
          ]
          if all(entry in lines for entry in entries):
              raise SystemExit(0)
          out = []
          inserted = False
          for line in lines:
              out.append(line)
              if line.strip() == "assets:" and not inserted:
                  out.extend(entries)
                  inserted = True
          if not inserted:
              raise SystemExit("Could not find flutter assets section in pubspec.yaml")
          pubspec.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          rm -rf "${tmp_dir}"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Pigeon bindings
        run: dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        env:
          HAPP_CRYPTO_TESTS: ${{ inputs.include_private_happ_assets && 'true' || 'false' }}
        run: flutter test

      - name: Build obfuscated ABI APKs
        shell: bash
        run: |
          mkdir -p build/release-apks

          if [[ "${GITHUB_REPOSITORY:-}" != */* ]]; then
            echo "::error title=Invalid repository identity::GITHUB_REPOSITORY must be owner/name"
            exit 1
          fi
          update_repository_owner="${GITHUB_REPOSITORY%%/*}"
          update_repository_name="${GITHUB_REPOSITORY#*/}"
          if [ -z "$update_repository_owner" ] || \
             [ -z "$update_repository_name" ] || \
             [[ "$update_repository_name" == */* ]]; then
            echo "::error title=Invalid repository identity::Cannot derive updater owner/name from GITHUB_REPOSITORY"
            exit 1
          fi

          common_args=(
            --release
            --obfuscate
            --build-name "${RELEASE_VERSION}"
            --split-debug-info=build/debug-info/android
            "--dart-define=HYDRABOX_UPDATE_REPOSITORY_OWNER=${update_repository_owner}"
            "--dart-define=HYDRABOX_UPDATE_REPOSITORY_NAME=${update_repository_name}"
          )
          if [ -n "${BUILD_NUMBER}" ]; then
            common_args+=(--build-number "${BUILD_NUMBER}")
          fi

          flutter build apk "${common_args[@]}" --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/release-apks/hydrabox-v${RELEASE_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "build/release-apks/hydrabox-v${RELEASE_VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "build/release-apks/hydrabox-v${RELEASE_VERSION}-x86_64.apk"

      - name: List APK outputs
        run: ls -lah build/release-apks/*.apk

      - name: Verify release APK identity, ABI isolation, and size
        shell: bash
        run: |
          set -euo pipefail
          arm64="build/release-apks/hydrabox-v${RELEASE_VERSION}-arm64-v8a.apk"
          test -s "$arm64"
          max_arm64_bytes=$((96 * 1024 * 1024))
          actual_arm64_bytes="$(stat -c%s "$arm64")"
          if [ "$actual_arm64_bytes" -gt "$max_arm64_bytes" ]; then
            echo "::error title=ARM64 APK size regression::${actual_arm64_bytes} bytes exceeds ${max_arm64_bytes}"
            exit 1
          fi

          for spec in \
            "arm64-v8a:arm64-v8a" \
            "armeabi-v7a:armeabi-v7a" \
            "x86_64:x86_64"; do
            file_token="${spec%%:*}"
            expected_abi="${spec#*:}"
            apk="build/release-apks/hydrabox-v${RELEASE_VERSION}-${file_token}.apk"
            test -s "$apk"
            mapfile -t packaged_abis < <(
              unzip -Z1 "$apk" \
                | sed -n 's#^lib/\([^/]*\)/libbox\.so$#\1#p' \
                | sort -u
            )
            if [ "${#packaged_abis[@]}" -ne 1 ] || [ "${packaged_abis[0]}" != "$expected_abi" ]; then
              echo "::error title=ABI packaging failure::${apk} contains libbox ABIs: ${packaged_abis[*]:-none}"
              exit 1
            fi
          done

          analyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$analyzer"
          test -x "$apksigner"
          if [ "$($analyzer manifest debuggable "$arm64")" != "false" ]; then
            echo "::error title=Debuggable release::ARM64 release APK is debuggable"
            exit 1
          fi
          if "$analyzer" manifest permissions "$arm64" \
            | grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "::error title=Unsafe installer permission::User APK must not request package installation privileges"
            exit 1
          fi
          python3 - "$arm64" <<'PY'
          import struct
          import sys
          import zipfile

          apk = sys.argv[1]
          entry = "lib/arm64-v8a/libbox.so"
          with zipfile.ZipFile(apk) as archive:
              data = archive.read(entry)
          if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
              raise SystemExit("ARM64 libbox.so is not a little-endian ELF64 binary")
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize = struct.unpack_from("<H", data, 54)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          alignments = []
          for index in range(phnum):
              offset = phoff + index * phentsize
              if struct.unpack_from("<I", data, offset)[0] == 1:
                  alignments.append(struct.unpack_from("<Q", data, offset + 48)[0])
          if not alignments or any(value < 16384 or value % 16384 for value in alignments):
              raise SystemExit(f"HydraCore PT_LOAD alignment is not 16 KiB compatible: {alignments}")
          print(f"HydraCore ARM64 PT_LOAD alignments: {alignments}")
          PY
          "$apksigner" verify --verbose --print-certs "$arm64"
          actual_cert="$($apksigner verify --print-certs "$arm64" 2>&1 \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error title=Signing identity mismatch::release certificate does not match the pinned publisher identity"
            exit 1
          fi

      - name: Generate updater manifest
        shell: bash
        env:
          HYDRABOX_UPDATE_KEY_ID: ${{ vars.HYDRABOX_UPDATE_KEY_ID }}
          HYDRABOX_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.HYDRABOX_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          apk="build/release-apks/hydrabox-v${RELEASE_VERSION}-arm64-v8a.apk"
          analyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$analyzer" ]; then
            analyzer="$(command -v apkanalyzer || true)"
          fi
          if [ -z "$analyzer" ] || [ ! -x "$analyzer" ]; then
            echo "::error title=Missing apkanalyzer::Cannot read APK compatibility metadata"
            exit 1
          fi
          min_sdk="$($analyzer manifest min-sdk "$apk")"
          version_code="$($analyzer manifest version-code "$apk")"
          key_id="${HYDRABOX_UPDATE_KEY_ID:-hydrabox-update-1}"
          published_at="$(git show -s --format=%cI HEAD)"
          python3 - "$RELEASE_VERSION" "$version_code" "$min_sdk" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$published_at" "$key_id" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          version, build_number, min_sdk, release_sequence, source_commit, published_at, key_id = sys.argv[1:]
          assets = []
          for apk in sorted(Path("build/release-apks").glob("*.apk")):
              assets.append({
                  "name": apk.name,
                  "sizeBytes": apk.stat().st_size,
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              })
          manifest = {
              "schemaVersion": 1,
              "distributionId": "io.hydrabox.client",
              "releaseSequence": int(release_sequence),
              "version": version,
              "buildNumber": int(build_number),
              "minSdk": int(min_sdk),
              "packageName": "io.hydrabox.client",
              "sourceCommit": source_commit,
              "publishedAt": published_at,
              "keyId": key_id,
              "assets": assets,
          }
          Path("build/release-apks/hydrabox-update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          go run scripts/sign_update_manifest.go \
            -input build/release-apks/hydrabox-update.json \
            -output build/release-apks/hydrabox-update.json.sig \
            -private-key "$HYDRABOX_UPDATE_ED25519_PRIVATE_KEY"
          test "$(wc -c < build/release-apks/hydrabox-update.json.sig)" -eq 64
          cat build/release-apks/hydrabox-update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydrabox-release-apks-${{ github.run_number }}
          path: |
            build/release-apks/*.apk
            build/release-apks/hydrabox-update.json
            build/release-apks/hydrabox-update.json.sig
          if-no-files-found: error
          retention-days: 14

      - name: Upload user-ready ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HydraBox-ARM64-INSTALL-THIS-${{ github.run_number }}
          path: build/release-apks/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydrabox-dart-debug-info-${{ github.run_number }}
          path: build/debug-info/android/**
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="build/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v version="$RELEASE_VERSION" '
              index($0, "## [" version "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          else
            : > "$notes_file"
          fi
          cat >> "$notes_file" <<EOF

          ---

          Signed Android APKs built from ${GITHUB_SHA}.
          Dart obfuscation is enabled. Debug symbols are attached as a separate workflow artifact.

          Assets:
          - hydrabox-v${RELEASE_VERSION}-arm64-v8a.apk
          - hydrabox-v${RELEASE_VERSION}-armeabi-v7a.apk
          - hydrabox-v${RELEASE_VERSION}-x86_64.apk
          - hydrabox-update.json
          - hydrabox-update.json.sig
          EOF

          if gh release view "$TAG_NAME" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release-state.json)" != "true" ]; then
              echo "::error title=Published release exists::Refusing to replace ${TAG_NAME}" >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$notes_file"
            gh release upload "$TAG_NAME" build/release-apks/*.apk build/release-apks/hydrabox-update.json build/release-apks/hydrabox-update.json.sig --clobber
          else
            gh release create "$TAG_NAME" build/release-apks/*.apk build/release-apks/hydrabox-update.json build/release-apks/hydrabox-update.json.sig \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file"
          fi
