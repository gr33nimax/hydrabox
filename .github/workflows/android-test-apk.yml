name: HydraBox test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build remotely verified APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify and fetch HydraCore
        run: |
          python3 -B scripts/verify_extended_core.py --source-only
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py
          python3 -B scripts/verify_client_boundaries.py

      - name: Generate client sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Build release-mode APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs and generated bindings
        uses: actions/upload-artifact@v7.0.0
        with:
          name: hydrabox-${{ github.ref_name }}-${{ github.run_number }}
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*.apk
            lib/singbox/singbox_api.g.dart
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt
