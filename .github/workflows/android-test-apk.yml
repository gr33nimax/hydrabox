name: HydraBox · Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  build-test-apk:
    name: Build debug-signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Select pinned libbox source
        id: libbox_source
        shell: bash
        run: |
          set -euo pipefail
          core_commit="$(git rev-parse HEAD:etonify-core)"
          release_commit="$(
            python3 -c \
              'import json; print(json.load(open("android/app/libs/libbox.provenance.json", encoding="utf-8"))["source_commit"])'
          )"
          if [ "$core_commit" = "$release_commit" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Using published HydraCore release for ${core_commit}."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building pinned HydraCore source ${core_commit}."
          fi

      - name: Set up Go for pinned HydraCore
        if: steps.libbox_source.outputs.build == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: etonify-core/go.mod
          cache-dependency-path: etonify-core/go.sum

      - name: Set up OpenJDK for pinned HydraCore
        if: steps.libbox_source.outputs.build == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK for pinned HydraCore
        if: steps.libbox_source.outputs.build == 'true'
        id: setup_core_ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28

      - name: Verify pinned HydraCore baseline
        if: steps.libbox_source.outputs.build == 'true'
        working-directory: etonify-core
        run: bash release/verify_etonify_baseline.sh

      - name: Build pinned HydraCore AAR
        if: steps.libbox_source.outputs.build == 'true'
        working-directory: etonify-core
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_core_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          if ! [[ "$version" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]{0,126}$ ]]; then
            echo "::error title=Invalid HydraCore version::Found '${version}'" >&2
            exit 1
          fi
          git tag -f "$version" HEAD
          make lib_install
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make lib_android
          test -s libbox.aar
          test -s libbox-sources.jar

      - name: Prepare source-built libbox provenance
        if: steps.libbox_source.outputs.build == 'true'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_core_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          source etonify-core/release/ETONIFY_BASELINE
          libs="android/app/libs"
          cp etonify-core/libbox.aar "$libs/libbox.aar"
          cp etonify-core/libbox-sources.jar "$libs/libbox-sources.jar"
          (
            cd "$libs"
            sha256sum libbox.aar > libbox.sha256
          )

          export LIBBOX_SHA256="$(sha256sum "$libs/libbox.aar" | awk '{print $1}')"
          export LIBBOX_SOURCES_SHA256="$(sha256sum "$libs/libbox-sources.jar" | awk '{print $1}')"
          export LIBBOX_SIZE_BYTES="$(stat --format=%s "$libs/libbox.aar")"
          export CORE_COMMIT="$(git rev-parse HEAD:etonify-core)"
          export CORE_RELEASE_TAG="$(tr -d '\r\n' < etonify-core/release/HYDRACORE_VERSION)"
          export CORE_ETONIFY_VERSION="$(tr -d '\r\n' < etonify-core/release/ETONIFY_VERSION)"
          export PUBLISHED_GO="$(go version)"
          export PUBLISHED_GOMOBILE="$GOMOBILE_VERSION"
          export PUBLISHED_JAVA="$(java --version 2>&1 | head -n 1)"
          export PUBLISHED_ANDROID_NDK="$(
            awk -F= '$1 ~ /^Pkg\.Revision[[:space:]]*$/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              print $2
            }' "$ANDROID_NDK_HOME/source.properties"
          )"
          export PUBLISHED_ANDROID_NDK_REQUESTED="$ANDROID_NDK_VERSION"
          export LIBBOX_ANDROID_API LIBBOX_BUILD_TAGS

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release_tag = os.environ["CORE_RELEASE_TAG"]
          provenance = {
              "schema_version": 2,
              "artifact": "libbox.aar",
              "distribution_id": "io.hydrabox.hydracore",
              "distribution_name": "HydraCore",
              "upstream_project": "etonify-core",
              "sha256": os.environ["LIBBOX_SHA256"],
              "sources_sha256": os.environ["LIBBOX_SOURCES_SHA256"],
              "size_bytes": int(os.environ["LIBBOX_SIZE_BYTES"]),
              "download_url": (
                  "https://github.com/gr33nimax/hydracore/releases/download/"
                  f"{release_tag}/libbox.aar"
              ),
              "core_version": release_tag,
              "release_tag": release_tag,
              "etonify_version": os.environ["CORE_ETONIFY_VERSION"],
              "source_repository": "https://github.com/gr33nimax/hydracore.git",
              "source_branch": "main",
              "source_commit": os.environ["CORE_COMMIT"],
              "go": os.environ["PUBLISHED_GO"],
              "gomobile": os.environ["PUBLISHED_GOMOBILE"],
              "java": os.environ["PUBLISHED_JAVA"],
              "android_ndk": os.environ["PUBLISHED_ANDROID_NDK"],
              "android_ndk_requested": os.environ[
                  "PUBLISHED_ANDROID_NDK_REQUESTED"
              ],
              "android_api": int(os.environ["LIBBOX_ANDROID_API"]),
              "build_tags": os.environ["LIBBOX_BUILD_TAGS"],
          }
          Path("android/app/libs/libbox.provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fetch verified libbox release asset
        if: steps.libbox_source.outputs.build != 'true'
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify pinned libbox binary
        run: python3 -B scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Pigeon bindings
        shell: bash
        run: |
          if [ -f pigeons/singbox_api.dart ]; then
            dart run pigeon --input pigeons/singbox_api.dart
          else
            echo "No Pigeon schema found; skipping."
          fi

      - name: Build test APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: |
          version="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          if [ -z "$version" ]; then
            echo "::error title=Missing version::Could not read the version from pubspec.yaml"
            exit 1
          fi

          mkdir -p build/test-apks
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/test-apks/hydrabox-v${version}-TEST-DEBUG-SIGNED-NOT-FOR-RELEASE.apk"

          sha256sum build/test-apks/*.apk > build/test-apks/SHA256SUMS.txt
          {
            echo "TEST BUILD — NOT FOR DISTRIBUTION"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Version: ${version}"
            echo "Build mode: Flutter release"
            echo "Signing: Android debug certificate"
            echo "Private Happ Crypto assets: not included"
            echo "Libbox SHA-256: $(cut -d' ' -f1 android/app/libs/libbox.sha256)"
          } > build/test-apks/BUILD-INFO.txt

      - name: List APK outputs
        run: |
          ls -lah build/test-apks
          cat build/test-apks/SHA256SUMS.txt
          cat build/test-apks/BUILD-INFO.txt

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: hydrabox-test-apks-${{ github.run_number }}
          path: build/test-apks/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
