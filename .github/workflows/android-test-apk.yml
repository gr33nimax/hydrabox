name: HydraBox test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build remotely verified APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up pinned HydraCore Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hydracore/go.mod
          cache: true
          cache-dependency-path: hydracore/go.sum

      - name: Set up HydraCore JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK for HydraCore
        id: setup-hydracore-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28

      - name: Reproduce pinned HydraCore AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-hydracore-ndk.outputs.ndk-path }}
        run: bash scripts/build_pinned_libbox.sh

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify reproduced HydraCore
        run: |
          python3 -B scripts/verify_extended_core.py --source-only
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py
          python3 -B scripts/verify_client_boundaries.py

      - name: Generate client sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest

      - name: Build debug-signed release-mode APK
        env:
          HYDRABOX_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/HydraBox-0.5.0-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: hydrabox-0.5.0-test-apk
          retention-days: 14
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/HydraBox-0.5.0-test.apk
