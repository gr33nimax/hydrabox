name: Verify pinned HydraCore

on:
  push:
    branches: [main]
    paths:
      - .gitmodules
      - hydracore
      - android/app/libs/**
      - scripts/fetch_libbox.py
      - scripts/libbox_provenance.py
      - scripts/verify_extended_core.py
      - scripts/verify_libbox.py
      - scripts/tests/**
      - .github/workflows/sync-hydracore.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-hydracore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, release assets, and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tooling
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Verify HydraCore source contract
        run: python3 -B scripts/verify_extended_core.py --source-only

      - name: Fetch and verify published Android artifacts
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py
