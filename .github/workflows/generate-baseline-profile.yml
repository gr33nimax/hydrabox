name: HydraBox · Generate Baseline Profile

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to commit the generated profile to (leave blank for current ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-baseline-profile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  HYDRACORE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRACORE_RELEASE_PUBLIC_KEYS }}

jobs:
  generate-profile:
    name: Generate Baseline Profile · API 34
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch verified HydraCore Android artifact
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py

      - name: Generate remote Flutter sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline Profile on Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          HYDRABOX_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        with:
          api-level: 34
          system-image-api-level: 34
          channel: stable
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: |
            chmod +x android/gradlew
            cd android
            ./gradlew :app:generateBaselineProfile \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
              --stacktrace

      - name: Upload generated profile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-profiles
          path: |
            android/app/src/main/baselineProfiles/
            android/app/src/release/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit or update baseline profile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d "android/app/src/release/generated/baselineProfiles" ]; then
            mkdir -p android/app/src/main/baselineProfiles
            cp -rf android/app/src/release/generated/baselineProfiles/* android/app/src/main/baselineProfiles/ || true
          fi

          if git status --porcelain android/app/src/main/baselineProfiles/ | grep -q .; then
            git add android/app/src/main/baselineProfiles/
            git commit -m "chore(perf): update baseline profile from automated benchmark"
            target="${{ inputs.target_branch }}"
            if [ -z "$target" ]; then
              target="${{ github.ref_name }}"
            fi
            git push origin "HEAD:${target}" || echo "Push failed or not permitted, artifact is preserved."
          else
            echo "No baseline profile changes detected."
          fi
