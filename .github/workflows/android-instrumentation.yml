name: HydraBox Android instrumentation

on:
  pull_request:
    paths:
      - ".github/workflows/android-instrumentation.yml"
      - ".github/scripts/run-android-instrumentation.sh"
      - "android/**"
      - "hydracore"
      - "pigeons/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/fetch_libbox.py"
      - "scripts/verify_libbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  HYDRACORE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRACORE_RELEASE_PUBLIC_KEYS }}

jobs:
  build-test-apks:
    name: Build instrumentation APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch verified HydraCore Android artifact
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py

      - name: Generate remote Flutter sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Build application and instrumentation APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload instrumentation APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-test-only-do-not-install
          path: |
            build/app/outputs/apk/debug/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  runtime-process:
    name: Runtime isolation · API ${{ matrix.api-level }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-test-apks
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 30, 34]
        arch: [x86_64]
        runner: [ubuntu-latest]
        include:
          - api-level: 37
            sdk-level: "37.0"
            target: google_apis
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Checkout instrumentation runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download instrumentation APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-instrumentation-test-only-do-not-install
          path: instrumentation-apks

      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated-runtime instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk-level || matrix.api-level }}
          system-image-api-level: ${{ matrix.sdk-level || matrix.api-level }}
          channel: ${{ matrix.api-level == 37 && 'canary' || 'stable' }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target || 'default' }}
          profile: pixel_2
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: |
            bash .github/scripts/run-android-instrumentation.sh "${{ matrix.api-level }}" "${{ matrix.arch }}"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ matrix.arch }}
          path: build/instrumentation/**
          if-no-files-found: warn
          retention-days: 14

  arm64-payload:
    name: Verify packaged ARM64 runtime
    runs-on: ubuntu-latest
    needs: build-test-apks
    timeout-minutes: 10
    steps:
      - name: Download instrumentation APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-instrumentation-test-only-do-not-install
          path: instrumentation-apks

      - name: Verify ARM64 Flutter and HydraCore binaries
        shell: bash
        run: |
          app_apk="$(find instrumentation-apks -name app-debug.apk -print -quit)"
          test -f "$app_apk"
          unzip -Z1 "$app_apk" | grep -Fx 'lib/arm64-v8a/libflutter.so'
          unzip -Z1 "$app_apk" | grep -Fx 'lib/arm64-v8a/libbox.so'
          unzip -p "$app_apk" lib/arm64-v8a/libbox.so > "$RUNNER_TEMP/libbox-arm64.so"
          readelf -h "$RUNNER_TEMP/libbox-arm64.so" | grep -Eq 'Machine:[[:space:]]+AArch64'
          python3 - "$RUNNER_TEMP/libbox-arm64.so" <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
              raise SystemExit("ARM64 libbox.so is not a little-endian ELF64 binary")
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize = struct.unpack_from("<H", data, 54)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          alignments = []
          for index in range(phnum):
              offset = phoff + index * phentsize
              if struct.unpack_from("<I", data, offset)[0] == 1:
                  alignments.append(struct.unpack_from("<Q", data, offset + 48)[0])
          if not alignments or any(value < 16384 or value % 16384 for value in alignments):
              raise SystemExit(f"HydraCore PT_LOAD alignment is not 16 KiB compatible: {alignments}")
          print(f"HydraCore ARM64 PT_LOAD alignments: {alignments}")
          PY
