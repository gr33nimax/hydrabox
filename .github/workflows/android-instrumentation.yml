name: HydraBox Android instrumentation

on:
  pull_request:
    paths:
      - ".github/workflows/android-instrumentation.yml"
      - "android/**"
      - "hydracore"
      - "pigeons/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/fetch_libbox.py"
      - "scripts/verify_libbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  runtime-process:
    name: Runtime isolation · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 30, 34, 37]

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch verified HydraCore Android artifact
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py

      - name: Generate remote Flutter sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated-runtime instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          channel: ${{ matrix.api-level == 37 && 'canary' || 'stable' }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: chmod +x android/gradlew && cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}
          path: |
            build/app/reports/androidTests/connected/**
            build/app/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
