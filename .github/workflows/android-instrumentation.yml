name: HydraBox Android instrumentation

on:
  pull_request:
    paths:
      - ".github/workflows/android-instrumentation.yml"
      - "android/**"
      - "hydracore"
      - "pigeons/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/fetch_libbox.py"
      - "scripts/verify_libbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  HYDRACORE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRACORE_RELEASE_PUBLIC_KEYS }}

jobs:
  build-test-apks:
    name: Build instrumentation APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch verified HydraCore Android artifact
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_libbox.py

      - name: Generate remote Flutter sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Build application and instrumentation APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload instrumentation APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-apks
          path: |
            build/app/outputs/apk/debug/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  runtime-process:
    name: Runtime isolation · API ${{ matrix.api-level }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-test-apks
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 30, 34]
        arch: [x86_64]
        runner: [ubuntu-latest]
        include:
          - api-level: 37
            sdk-level: "37.0"
            target: google_apis
            arch: x86_64
            runner: ubuntu-latest
          - api-level: 30
            arch: arm64-v8a
            runner: macos-15

    steps:
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download instrumentation APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-instrumentation-apks
          path: instrumentation-apks

      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated-runtime instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk-level || matrix.api-level }}
          system-image-api-level: ${{ matrix.sdk-level || matrix.api-level }}
          channel: ${{ matrix.api-level == 37 && 'canary' || 'stable' }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target || 'default' }}
          profile: pixel_2
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: ${{ runner.os == 'Linux' && matrix.arch == 'arm64-v8a' }}
          emulator-boot-timeout: ${{ matrix.arch == 'arm64-v8a' && 1200 || 600 }}
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: |
            test -f "$(find instrumentation-apks -name app-debug.apk -print -quit)"
            test -f "$(find instrumentation-apks -name app-debug-androidTest.apk -print -quit)"
            adb install -r "$(find instrumentation-apks -name app-debug.apk -print -quit)"
            adb install -r "$(find instrumentation-apks -name app-debug-androidTest.apk -print -quit)"
            mkdir -p build/instrumentation
            adb logcat -c || true
            set +e; adb shell am instrument -w io.hydrabox.client.test/androidx.test.runner.AndroidJUnitRunner >"build/instrumentation/api-${{ matrix.api-level }}-${{ matrix.arch }}.txt" 2>&1; status=$?; adb logcat -d -v threadtime >"build/instrumentation/api-${{ matrix.api-level }}-${{ matrix.arch }}-logcat.txt" 2>&1; set -e; cat "build/instrumentation/api-${{ matrix.api-level }}-${{ matrix.arch }}.txt"; if [ "$status" -ne 0 ]; then grep -E 'HydraCore|HydraBox|AndroidRuntime|FATAL EXCEPTION|UnsatisfiedLinkError|linker' "build/instrumentation/api-${{ matrix.api-level }}-${{ matrix.arch }}-logcat.txt" || true; exit "$status"; fi; grep -E '^OK \([0-9]+ tests?\)$' "build/instrumentation/api-${{ matrix.api-level }}-${{ matrix.arch }}.txt"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ matrix.arch }}
          path: build/instrumentation/**
          if-no-files-found: warn
          retention-days: 14
