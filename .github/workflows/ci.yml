name: HydraBox client checks

on:
  push:
    branches:
      - main
      - debug
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      build_test_apk:
        description: Build and upload the debug-signed release-mode test APK
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: client-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  HYDRA_ULTIMATE_COMMIT: "a3990a2edfe4ef84b7757ea58b18f2fa9d4435e4"
  HYDRACORE_RELEASE_PUBLIC_KEYS: ${{ vars.HYDRACORE_RELEASE_PUBLIC_KEYS }}

jobs:
  verify:
    name: Remote verification
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout pinned HYDRA ULTIMATE producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gr33nimax/HYDRA-ULTIMATE
          ref: ${{ env.HYDRA_ULTIMATE_COMMIT }}
          path: build/hydra-ultimate
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Python release tooling
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Verify pinned HydraCore source contract
        run: python3 -B scripts/verify_extended_core.py --source-only

      - name: Verify HYDRA ULTIMATE subscription contract
        run: >-
          python3 -B scripts/verify_hydra_ultimate_contract.py
          build/hydra-ultimate
          "$HYDRA_ULTIMATE_COMMIT"

      - name: Fetch published HydraCore Android artifact
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify HydraCore artifacts and provenance
        run: python3 -B scripts/verify_libbox.py

      - name: Verify removed legacy boundaries
        run: python3 -B scripts/verify_client_boundaries.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate typed platform bindings
        run: dart run pigeon --input pigeons/singbox_api.dart

      - name: Format Dart sources and capture remote-generated changes
        run: |
          mkdir -p build
          dart format lib test pigeons
          git add -N \
            lib/l10n/generated/app_localizations*.dart \
            lib/singbox/singbox_api.g.dart \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt
          git diff --binary -- \
            lib test pigeons \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt \
            > build/remote-generated.patch

      - name: Check generated sources and Dart formatting
        run: |
          git diff --exit-code -- \
            lib test pigeons \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt

      - name: Analyze Flutter sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Run Android unit tests, lint, and debug assembly
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Resolve test APK version
        if: >-
          github.ref == 'refs/heads/debug' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_test_apk)
        id: test-version
        shell: bash
        run: |
          version="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build debug-signed release-mode test APK
        if: >-
          github.ref == 'refs/heads/debug' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_test_apk)
        env:
          HYDRABOX_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: |
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/HydraBox-${{ steps.test-version.outputs.version }}-debug-arm64-v8a.apk"

      - name: Upload test APK
        if: >-
          github.ref == 'refs/heads/debug' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_test_apk)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hydrabox-${{ steps.test-version.outputs.version }}-debug-apk
          retention-days: 14
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/HydraBox-${{ steps.test-version.outputs.version }}-debug-arm64-v8a.apk

      - name: Upload remote-generated bindings and reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hydrabox-remote-verification-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            lib/l10n/generated/app_localizations*.dart
            lib/singbox/singbox_api.g.dart
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt
            build/remote-generated.patch
            build/app/reports/**
            build/app/outputs/apk/debug/*.apk
