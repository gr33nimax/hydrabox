name: HydraBox · Client checks

on:
  push:
    branches:
      - main
      - master
      - develop
      - extended-core
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Test libbox release hydrator
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Fetch verified libbox release asset
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify pinned libbox binary
        run: python3 -B scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Pigeon bindings
        shell: bash
        run: |
          if [ -f pigeons/singbox_api.dart ]; then
            dart run pigeon --input pigeons/singbox_api.dart
          else
            echo "No Pigeon schema found; skipping."
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android unit tests, lint and debug assemble
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
