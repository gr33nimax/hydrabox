name: HydraBox client checks

on:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"
  HYDRA_ULTIMATE_COMMIT: "793b17f9167b5cd95d7acf68688f5eb6b76880ea"

jobs:
  verify:
    name: Remote verification
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout pinned HYDRA ULTIMATE producer
        uses: actions/checkout@v7.0.1
        with:
          repository: gr33nimax/HYDRA-ULTIMATE
          ref: ${{ env.HYDRA_ULTIMATE_COMMIT }}
          path: build/hydra-ultimate
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Python release tooling
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Verify pinned HydraCore source contract
        run: python3 -B scripts/verify_extended_core.py --source-only

      - name: Verify HYDRA ULTIMATE subscription contract
        run: >-
          python3 -B scripts/verify_hydra_ultimate_contract.py
          build/hydra-ultimate
          "$HYDRA_ULTIMATE_COMMIT"

      - name: Fetch pinned HydraCore Android artifact
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify HydraCore artifacts and provenance
        run: python3 -B scripts/verify_libbox.py

      - name: Verify removed legacy boundaries
        run: python3 -B scripts/verify_client_boundaries.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate typed platform bindings
        run: dart run pigeon --input pigeons/singbox_api.dart

      - name: Format Dart sources and capture remote-generated changes
        run: |
          mkdir -p build
          dart format lib test pigeons
          git add -N \
            lib/l10n/generated/app_localizations*.dart \
            lib/singbox/singbox_api.g.dart \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt
          git diff --binary -- \
            lib test pigeons \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt \
            > build/remote-generated.patch

      - name: Check generated sources and Dart formatting
        run: |
          git diff --exit-code -- \
            lib test pigeons \
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt

      - name: Analyze Flutter sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Run Android unit tests, lint, and debug assembly
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload remote-generated bindings and reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: hydrabox-remote-verification-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            lib/l10n/generated/app_localizations*.dart
            lib/singbox/singbox_api.g.dart
            android/app/src/main/kotlin/io/hydrabox/client/generated/SingboxApi.g.kt
            build/remote-generated.patch
            android/app/build/reports/**
            android/app/build/outputs/apk/debug/*.apk
