name: HydraBox · Client checks

on:
  push:
    branches:
      - main
      - master
      - develop
      - extended-core
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  JAVA_VERSION: "21"

jobs:
  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Test libbox release hydrator
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Fetch verified libbox release asset
        run: python3 -B scripts/fetch_libbox.py

      - name: Verify pinned libbox binary
        run: python3 -B scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Pigeon bindings
        shell: bash
        run: |
          if [ -f pigeons/singbox_api.dart ]; then
            dart run pigeon --input pigeons/singbox_api.dart
          else
            echo "No Pigeon schema found; skipping."
          fi

      - name: Normalize WDTT integration formatting on GitHub
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/data/subscription/parsers/hydrabox_subscription_parser.dart
            lib/data/subscription/subscription_parser.dart
            lib/singbox/extended_core_protocols.dart
            lib/singbox/libbox_capabilities.dart
            lib/singbox/singbox_config_builder.dart
            test/extended_core_compatibility_test.dart
            test/hydrabox_subscription_test.dart
            test/libbox_capabilities_test.dart
            test/subscription_parser_test.dart
          )
          dart format "${files[@]}"
          mapfile -t changed_files < <(git diff --name-only -- "${files[@]}")
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "WDTT integration source is normalized."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/extended-core" ]]; then
            git diff -- "${changed_files[@]}"
            echo "::error title=Unnormalized WDTT integration::Commit the GitHub-generated Dart formatting diff"
            exit 1
          fi

          git add -- "${changed_files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(wdtt): normalize HydraBox integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "GitHub committed normalized WDTT integration source; this run continues against the normalized worktree."

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          flutter test 2>&1 | tee "$log_file"
          test_status="${PIPESTATUS[0]}"
          if [[ "$test_status" -ne 0 ]]; then
            clean_log="$(mktemp)"
            sed -E $'s/\\x1B\\[[0-9;]*[[:alpha:]]//g' "$log_file" > "$clean_log"
            echo "::group::Flutter test failure diagnostics"
            grep -E -- '-[[:space:]]*[0-9]+:|\[E\]|Expected:|Actual:|Some tests failed|[0-9]+ tests passed|^package:' "$clean_log" \
              | tail -n 300 || true
            echo "::endgroup::"
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              escaped="${line//\%/\%25}"
              escaped="${escaped//$'\r'/\%0D}"
              escaped="${escaped//$'\n'/\%0A}"
              echo "::error title=Flutter test diagnostics::${escaped:0:2000}"
            done < <(
              grep -E -- '-[[:space:]]*(1|2|3):|\[E\]|Expected:|Actual:|Some tests failed|[0-9]+ tests passed|^package:' "$clean_log" \
                | tail -n 160
            )
          fi
          exit "$test_status"

      - name: Android unit tests, lint and debug assemble
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
