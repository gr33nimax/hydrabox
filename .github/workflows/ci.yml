name: CI

on:
  push:
  pull_request:

concurrency:
  group: hydrabox-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The core is fetched on its own, without the action's recursive submodule walk. The pinned
      # core commit carries an upstream gitlink (clients/desktop) whose .gitmodules entry is
      # missing, so a recursive checkout dies on a URL nobody can supply — and none of the core's
      # client submodules are used by this build. The submodule itself is needed: verifyLibboxProvenance
      # compares its HEAD with the published provenance.
      - name: Fetch the pinned core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git -c submodule.recurse=false submodule update --init --depth=1 hydracore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - run: python3 .github/scripts/hydrate_libbox.py
      - name: Verify TV remote navigation
        run: ./gradlew :ui:design:jvmTest --stacktrace
      - run: ./gradlew ciCheck :platform:android:assembleRelease --stacktrace
      - name: Verify all packaged architectures
        run: TAG=ci python3 .github/scripts/release_artifacts.py collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/*-preview/**
            platform/android/build/outputs/apk/release/*.apk
            platform/android/build/outputs/mapping/release/**
            release/SHA256SUMS
            release/artifacts.json
          if-no-files-found: error
