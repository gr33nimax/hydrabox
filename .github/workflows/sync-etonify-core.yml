name: HydraCore · Sync extended libbox

on:
  push:
    branches:
      - main
      - master
      - extended-core
    paths:
      - .gitattributes
      - .gitignore
      - .gitmodules
      - etonify-core
      - scripts/fetch_libbox.py
      - scripts/libbox_provenance.py
      - scripts/tests/**
      - scripts/verify_extended_core.py
      - scripts/verify_libbox.py
      - .github/workflows/sync-etonify-core.yml
  workflow_dispatch:
    inputs:
      expected_core_version:
        description: "Optional exact version reported by git describe"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-etonify-core-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "r28"
  CORE_REPOSITORY: "https://github.com/gr33nimax/hydracore.git"
  CORE_BRANCH: "extended-integration"
  CORE_RELEASE_REPOSITORY: "gr33nimax/hydracore"
  CORE_DISTRIBUTION_ID: "io.hydrabox.hydracore"
  CORE_DISTRIBUTION_NAME: "HydraCore"
  CORE_UPSTREAM_PROJECT: "etonify-core"

jobs:
  sync-libbox:
    name: Build and commit verified extended metadata
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout HydraBox and pinned core source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Test libbox release hydrator
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Validate pinned extended core
        id: core_metadata
        shell: bash
        env:
          EXPECTED_CORE_VERSION: ${{ inputs.expected_core_version }}
        run: |
          set -euo pipefail

          configured_repository="$(git config -f .gitmodules --get submodule.etonify-core.url)"
          configured_branch="$(git config -f .gitmodules --get submodule.etonify-core.branch)"
          if [ "$configured_repository" != "$CORE_REPOSITORY" ]; then
            echo "::error title=Unexpected core repository::Expected $CORE_REPOSITORY, found $configured_repository"
            exit 1
          fi
          if [ "$configured_branch" != "$CORE_BRANCH" ]; then
            echo "::error title=Unexpected core branch::Expected $CORE_BRANCH, found $configured_branch"
            exit 1
          fi

          gitlink_commit="$(git rev-parse HEAD:etonify-core)"
          checkout_commit="$(git -C etonify-core rev-parse HEAD)"
          if [ "$checkout_commit" != "$gitlink_commit" ]; then
            echo "::error title=Core gitlink mismatch::Superproject pins $gitlink_commit, checkout is $checkout_commit"
            exit 1
          fi
          if [ -n "$(git -C etonify-core status --porcelain --untracked-files=no)" ]; then
            echo "::error title=Dirty core checkout::The pinned core must be built without local changes"
            git -C etonify-core status --short --untracked-files=no
            exit 1
          fi

          git -C etonify-core fetch --no-tags origin \
            "+refs/heads/${CORE_BRANCH}:refs/remotes/origin/${CORE_BRANCH}"
          git -C etonify-core fetch --force origin \
            "+refs/tags/*:refs/tags/*"
          branch_commit="$(
            git -C etonify-core rev-parse "refs/remotes/origin/${CORE_BRANCH}"
          )"
          if [ "$checkout_commit" != "$branch_commit" ]; then
            echo "::error title=Core branch mismatch::Gitlink is $checkout_commit, but $CORE_BRANCH is $branch_commit"
            exit 1
          fi

          core_version="$(
            git -C etonify-core describe \
              --tags \
              --always \
              --abbrev=8 \
              --exclude='v*-etonify.*'
          )"
          if [ -n "$EXPECTED_CORE_VERSION" ] && \
             [ "$EXPECTED_CORE_VERSION" != "$core_version" ]; then
            echo "::error title=Core version mismatch::Expected $EXPECTED_CORE_VERSION, found $core_version"
            exit 1
          fi
          release_tag="$(tr -d '\r\n' < etonify-core/release/HYDRACORE_VERSION)"
          if ! [[ "$release_tag" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]]; then
            echo "::error title=Invalid core release tag::Found '${release_tag}' in release/HYDRACORE_VERSION"
            exit 1
          fi
          etonify_version="$(tr -d '\r\n' < etonify-core/release/ETONIFY_VERSION)"
          if ! [[ "$etonify_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]]; then
            echo "::error title=Invalid Etonify provenance version::Found '${etonify_version}'"
            exit 1
          fi

          artifact_version="$(printf '%s' "$core_version" | tr '/[:space:]' '--')"
          echo "version=$core_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "etonify_version=$etonify_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"
          echo "Building $core_version from $checkout_commit for release $release_tag"

      - name: Verify extended protocol surface
        run: python3 scripts/verify_extended_core.py --source-only

      - name: Read Android build settings
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          build_tags="$(python3 scripts/verify_extended_core.py --print-build-tags)"
          android_api="$(python3 scripts/verify_extended_core.py --print-android-api)"
          test -n "$build_tags"
          test -n "$android_api"
          echo "tags=$build_tags" >> "$GITHUB_OUTPUT"
          echo "android_api=$android_api" >> "$GITHUB_OUTPUT"
          echo "Android API $android_api; build tags: $build_tags"

      - name: Set up Go from core go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: etonify-core/go.mod
          cache-dependency-path: etonify-core/go.sum

      - name: Set up OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Verify pinned build baseline
        working-directory: etonify-core
        shell: bash
        env:
          EXPECTED_JAVA_VERSION: ${{ env.JAVA_VERSION }}
          EXPECTED_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euo pipefail
          declared_go="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          # shellcheck disable=SC1091
          source release/ETONIFY_BASELINE
          test "$GO_VERSION" = "$declared_go"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$JAVA_VERSION" = "$EXPECTED_JAVA_VERSION"
          test "$ANDROID_NDK_VERSION" = "$EXPECTED_ANDROID_NDK_VERSION"
          bash release/verify_etonify_baseline.sh

      - name: Test host-compatible extended core tags
        working-directory: etonify-core
        env:
          LIBBOX_BUILD_TAGS: ${{ steps.android_build.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a build_tags <<< "$LIBBOX_BUILD_TAGS"
          host_tags=()
          naive_tag_found=false
          for tag in "${build_tags[@]}"; do
            # Naive embeds target-specific Cronet archives. Its full Android
            # compile/link validation is performed by the gomobile step below.
            if [ "$tag" = "with_naive_outbound" ]; then
              naive_tag_found=true
            else
              host_tags+=("$tag")
            fi
          done
          [ "$naive_tag_found" = true ]
          (
            IFS=','
            go test \
              -ldflags "$(cat release/LDFLAGS)" \
              -tags "${host_tags[*]}" \
              ./...
          )

      - name: Build libbox and sources
        working-directory: etonify-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make lib_android
          test -s libbox.aar
          test -s libbox-sources.jar
          unzip -tqq libbox.aar
          unzip -tqq libbox-sources.jar

      - name: Prepare verified libbox artifacts
        shell: bash
        env:
          CORE_VERSION: ${{ steps.core_metadata.outputs.version }}
          CORE_RELEASE_TAG: ${{ steps.core_metadata.outputs.release_tag }}
          CORE_ETONIFY_VERSION: ${{ steps.core_metadata.outputs.etonify_version }}
          CORE_COMMIT: ${{ steps.core_metadata.outputs.commit }}
          LIBBOX_ANDROID_API: ${{ steps.android_build.outputs.android_api }}
          LIBBOX_BUILD_TAGS: ${{ steps.android_build.outputs.tags }}
        run: |
          set -euo pipefail

          libs="android/app/libs"
          mkdir -p "$libs"
          cp etonify-core/libbox.aar "$libs/libbox.aar"
          cp etonify-core/libbox-sources.jar "$libs/libbox-sources.jar"
          (
            cd "$libs"
            sha256sum libbox.aar > libbox.sha256
          )

          export REBUILT_LIBBOX_SHA256="$(
            sha256sum "$libs/libbox.aar" | awk '{print $1}'
          )"
          export REBUILT_LIBBOX_SOURCES_SHA256="$(
            sha256sum "$libs/libbox-sources.jar" | awk '{print $1}'
          )"
          export REBUILT_LIBBOX_SIZE_BYTES="$(stat --format=%s "$libs/libbox.aar")"
          export LIBBOX_DOWNLOAD_URL="https://github.com/${CORE_RELEASE_REPOSITORY}/releases/download/${CORE_RELEASE_TAG}/libbox.aar"

          release_tmp="$(mktemp -d)"
          trap 'rm -rf "$release_tmp"' EXIT
          release_api="https://api.github.com/repos/${CORE_RELEASE_REPOSITORY}/releases/tags/${CORE_RELEASE_TAG}"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 \
            --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "$release_tmp/release.json" \
            "$release_api"
          if ! jq --exit-status \
            --arg tag "$CORE_RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == true' \
            "$release_tmp/release.json" >/dev/null; then
            echo "::error title=Invalid core release::Expected published prerelease ${CORE_RELEASE_TAG}"
            jq '{tag_name, draft, prerelease}' "$release_tmp/release.json"
            exit 1
          fi
          required_asset_count="$(
            jq \
              '[.assets[] | select(
                .name == "libbox.aar" or
                .name == "libbox.aar.sha256" or
                .name == "libbox-sources.jar" or
                .name == "provenance.json"
              )] | length' \
              "$release_tmp/release.json"
          )"
          if [ "$required_asset_count" != "4" ]; then
            echo "::error title=Incomplete core release::Expected all four required libbox assets, found ${required_asset_count}"
            jq '[.assets[].name]' "$release_tmp/release.json"
            exit 1
          fi

          published_url="$(
            jq --raw-output \
              '.assets[] | select(.name == "libbox.aar") | .browser_download_url' \
              "$release_tmp/release.json"
          )"
          published_size="$(
            jq --raw-output \
              '.assets[] | select(.name == "libbox.aar") | .size' \
              "$release_tmp/release.json"
          )"
          if [ "$published_url" != "$LIBBOX_DOWNLOAD_URL" ]; then
            echo "::error title=Published URL mismatch::Expected ${LIBBOX_DOWNLOAD_URL}, got ${published_url}"
            exit 1
          fi
          echo "Rebuilt libbox: sha256=${REBUILT_LIBBOX_SHA256} size=${REBUILT_LIBBOX_SIZE_BYTES}"
          echo "Published libbox: size=${published_size}"

          release_base="https://github.com/${CORE_RELEASE_REPOSITORY}/releases/download/${CORE_RELEASE_TAG}"
          for asset in libbox.aar.sha256 libbox-sources.jar provenance.json; do
            curl --fail-with-body --silent --show-error --location \
              --retry 3 \
              --retry-all-errors \
              --output "$release_tmp/$asset" \
              "$release_base/$asset"
          done
          published_sha="$(awk 'NR == 1 { print tolower($1) }' "$release_tmp/libbox.aar.sha256")"
          if ! [[ "$published_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid published checksum::libbox.aar.sha256 is malformed"
            exit 1
          fi
          if [ "$published_sha" != "$REBUILT_LIBBOX_SHA256" ]; then
            echo "::notice title=Non-byte-identical gomobile rebuild::The rebuilt AAR differs from the pinned release; the verified release asset remains authoritative"
          fi
          published_sources_sha="$(
            sha256sum "$release_tmp/libbox-sources.jar" | awk '{ print $1 }'
          )"
          if [ "$published_sources_sha" != "$REBUILT_LIBBOX_SOURCES_SHA256" ]; then
            echo "::error title=Published sources mismatch::Local generated sources do not match the published release"
            exit 1
          fi
          cp "$release_tmp/libbox-sources.jar" "$libs/libbox-sources.jar"
          export LIBBOX_SHA256="$published_sha"
          export LIBBOX_SOURCES_SHA256="$published_sources_sha"
          export LIBBOX_SIZE_BYTES="$published_size"
          printf '%s  libbox.aar\n' "$LIBBOX_SHA256" > "$libs/libbox.sha256"
          export CORE_RELEASE_TAG CORE_ETONIFY_VERSION CORE_COMMIT
          export LIBBOX_ANDROID_API LIBBOX_BUILD_TAGS
          python3 - "$release_tmp/provenance.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          provenance = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "artifact": "libbox.aar",
              "distribution_id": os.environ["CORE_DISTRIBUTION_ID"],
              "distribution_name": os.environ["CORE_DISTRIBUTION_NAME"],
              "upstream_project": os.environ["CORE_UPSTREAM_PROJECT"],
              "sha256": os.environ["LIBBOX_SHA256"].lower(),
              "source_commit": os.environ["CORE_COMMIT"],
              "source_version": os.environ["CORE_VERSION"],
              "hydracore_version": os.environ["CORE_RELEASE_TAG"],
              "etonify_version": os.environ["CORE_ETONIFY_VERSION"],
              "android_ndk_requested": os.environ["ANDROID_NDK_VERSION"],
              "build_tags": os.environ["LIBBOX_BUILD_TAGS"],
              "android_api": int(os.environ["LIBBOX_ANDROID_API"]),
          }
          actual = dict(provenance)
          actual["sha256"] = str(actual.get("sha256", "")).lower()
          mismatches = {
              field: (expected_value, actual.get(field))
              for field, expected_value in expected.items()
              if actual.get(field) != expected_value
          }
          if mismatches:
              for field, (expected_value, actual_value) in mismatches.items():
                  print(
                      f"::error title=Published provenance mismatch::"
                      f"{field}: expected {expected_value!r}, got {actual_value!r}"
                  )
              raise SystemExit(1)
          for field in ("go", "gomobile", "java", "android_ndk"):
              value = actual.get(field)
              if (
                  not isinstance(value, str)
                  or not value.strip()
                  or any(ord(character) < 32 for character in value)
              ):
                  print(
                      f"::error title=Invalid published provenance::"
                      f"{field} must be a non-empty string without control characters"
                  )
                  raise SystemExit(1)
          print("Published provenance matches the authoritative libbox release asset.")
          PY

          export CORE_VERSION CORE_RELEASE_TAG CORE_ETONIFY_VERSION CORE_COMMIT
          export CORE_REPOSITORY CORE_BRANCH
          export LIBBOX_ANDROID_API LIBBOX_BUILD_TAGS
          export PUBLISHED_GO="$(jq --exit-status --raw-output '.go' "$release_tmp/provenance.json")"
          export PUBLISHED_GOMOBILE="$(jq --exit-status --raw-output '.gomobile' "$release_tmp/provenance.json")"
          export PUBLISHED_JAVA="$(jq --exit-status --raw-output '.java' "$release_tmp/provenance.json")"
          export PUBLISHED_ANDROID_NDK="$(jq --exit-status --raw-output '.android_ndk' "$release_tmp/provenance.json")"
          export PUBLISHED_ANDROID_NDK_REQUESTED="$(jq --exit-status --raw-output '.android_ndk_requested' "$release_tmp/provenance.json")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema_version": 2,
              "artifact": "libbox.aar",
              "distribution_id": os.environ["CORE_DISTRIBUTION_ID"],
              "distribution_name": os.environ["CORE_DISTRIBUTION_NAME"],
              "upstream_project": os.environ["CORE_UPSTREAM_PROJECT"],
              "sha256": os.environ["LIBBOX_SHA256"],
              "sources_sha256": os.environ["LIBBOX_SOURCES_SHA256"],
              "size_bytes": int(os.environ["LIBBOX_SIZE_BYTES"]),
              "download_url": os.environ["LIBBOX_DOWNLOAD_URL"],
              "core_version": os.environ["CORE_VERSION"],
              "release_tag": os.environ["CORE_RELEASE_TAG"],
              "etonify_version": os.environ["CORE_ETONIFY_VERSION"],
              "source_repository": os.environ["CORE_REPOSITORY"],
              "source_branch": os.environ["CORE_BRANCH"],
              "source_commit": os.environ["CORE_COMMIT"],
              "go": os.environ["PUBLISHED_GO"],
              "gomobile": os.environ["PUBLISHED_GOMOBILE"],
              "java": os.environ["PUBLISHED_JAVA"],
              "android_ndk": os.environ["PUBLISHED_ANDROID_NDK"],
              "android_ndk_requested": os.environ["PUBLISHED_ANDROID_NDK_REQUESTED"],
              "android_api": int(os.environ["LIBBOX_ANDROID_API"]),
              "build_tags": os.environ["LIBBOX_BUILD_TAGS"],
          }
          Path("android/app/libs/libbox.provenance.json").write_text(
              json.dumps(
                  provenance,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fetch and verify published libbox release asset
        run: |
          python3 -B scripts/fetch_libbox.py
          python3 -B scripts/verify_extended_core.py
          python3 -B scripts/verify_libbox.py

      - name: Upload built libbox for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydracore-libbox-${{ steps.core_metadata.outputs.artifact_version }}-${{ github.run_number }}
          path: |
            android/app/libs/libbox.aar
            android/app/libs/libbox.provenance.json
            android/app/libs/libbox.sha256
            android/app/libs/libbox-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified core metadata
        shell: bash
        env:
          CORE_VERSION: ${{ steps.core_metadata.outputs.version }}
        run: |
          set -euo pipefail
          git add \
            android/app/libs/libbox.provenance.json \
            android/app/libs/libbox.sha256 \
            android/app/libs/libbox-sources.jar

          if git diff --cached --quiet; then
            echo "Bundled libbox metadata is already up to date."
            exit 0
          fi

          allowed_files="$(printf '%s\n' \
            android/app/libs/libbox.provenance.json \
            android/app/libs/libbox.sha256 \
            android/app/libs/libbox-sources.jar | sort)"
          unexpected_files="$(comm -23 \
            <(git diff --cached --name-only | sort) \
            <(printf '%s\n' "$allowed_files"))"
          if [ -n "$unexpected_files" ]; then
            echo "::error title=Unexpected files staged::The workflow may only update libbox metadata, checksum, and sources."
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(core): update extended libbox to ${CORE_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch client checks for committed metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(
            python3 -c \
              'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"]}))'
          )"
          for workflow in ci.yml codeql.yml; do
            curl --fail-with-body --silent --show-error --location \
              --retry 3 \
              --retry-all-errors \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data "$payload"
          done
