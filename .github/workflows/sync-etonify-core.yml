name: Etonify · Sync extended libbox

on:
  push:
    branches:
      - main
      - master
      - extended-core
    paths:
      - .gitattributes
      - .gitmodules
      - etonify-core
      - scripts/verify_extended_core.py
      - scripts/verify_libbox.py
      - .github/workflows/sync-etonify-core.yml
  workflow_dispatch:
    inputs:
      expected_core_version:
        description: "Optional exact version reported by git describe"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-etonify-core-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "r28"
  CORE_REPOSITORY: "https://github.com/gr33nimax/etonify-core.git"
  CORE_BRANCH: "extended-integration"

jobs:
  sync-libbox:
    name: Build and commit verified extended libbox
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Etonify and pinned core source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          lfs: true
          submodules: true

      - name: Validate pinned extended core
        id: core_metadata
        shell: bash
        env:
          EXPECTED_CORE_VERSION: ${{ inputs.expected_core_version }}
        run: |
          set -euo pipefail

          configured_repository="$(git config -f .gitmodules --get submodule.etonify-core.url)"
          configured_branch="$(git config -f .gitmodules --get submodule.etonify-core.branch)"
          if [ "$configured_repository" != "$CORE_REPOSITORY" ]; then
            echo "::error title=Unexpected core repository::Expected $CORE_REPOSITORY, found $configured_repository"
            exit 1
          fi
          if [ "$configured_branch" != "$CORE_BRANCH" ]; then
            echo "::error title=Unexpected core branch::Expected $CORE_BRANCH, found $configured_branch"
            exit 1
          fi

          gitlink_commit="$(git rev-parse HEAD:etonify-core)"
          checkout_commit="$(git -C etonify-core rev-parse HEAD)"
          if [ "$checkout_commit" != "$gitlink_commit" ]; then
            echo "::error title=Core gitlink mismatch::Superproject pins $gitlink_commit, checkout is $checkout_commit"
            exit 1
          fi
          if [ -n "$(git -C etonify-core status --porcelain --untracked-files=no)" ]; then
            echo "::error title=Dirty core checkout::The pinned core must be built without local changes"
            git -C etonify-core status --short --untracked-files=no
            exit 1
          fi

          git -C etonify-core fetch --no-tags origin \
            "+refs/heads/${CORE_BRANCH}:refs/remotes/origin/${CORE_BRANCH}"
          branch_commit="$(
            git -C etonify-core rev-parse "refs/remotes/origin/${CORE_BRANCH}"
          )"
          if [ "$checkout_commit" != "$branch_commit" ]; then
            echo "::error title=Core branch mismatch::Gitlink is $checkout_commit, but $CORE_BRANCH is $branch_commit"
            exit 1
          fi

          core_version="$(git -C etonify-core describe --tags --always)"
          if [ -n "$EXPECTED_CORE_VERSION" ] && \
             [ "$EXPECTED_CORE_VERSION" != "$core_version" ]; then
            echo "::error title=Core version mismatch::Expected $EXPECTED_CORE_VERSION, found $core_version"
            exit 1
          fi

          artifact_version="$(printf '%s' "$core_version" | tr '/[:space:]' '--')"
          echo "version=$core_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"
          echo "Building $core_version from $checkout_commit"

      - name: Verify extended protocol surface
        run: python3 scripts/verify_extended_core.py --source-only

      - name: Read Android build settings
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          build_tags="$(python3 scripts/verify_extended_core.py --print-build-tags)"
          android_api="$(python3 scripts/verify_extended_core.py --print-android-api)"
          test -n "$build_tags"
          test -n "$android_api"
          echo "tags=$build_tags" >> "$GITHUB_OUTPUT"
          echo "android_api=$android_api" >> "$GITHUB_OUTPUT"
          echo "Android API $android_api; build tags: $build_tags"

      - name: Set up Go from core go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: etonify-core/go.mod
          cache-dependency-path: etonify-core/go.sum

      - name: Set up OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Verify pinned build baseline
        working-directory: etonify-core
        shell: bash
        env:
          EXPECTED_JAVA_VERSION: ${{ env.JAVA_VERSION }}
          EXPECTED_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euo pipefail
          declared_go="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          # shellcheck disable=SC1091
          source release/ETONIFY_BASELINE
          test "$GO_VERSION" = "$declared_go"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$JAVA_VERSION" = "$EXPECTED_JAVA_VERSION"
          test "$ANDROID_NDK_VERSION" = "$EXPECTED_ANDROID_NDK_VERSION"
          bash release/verify_etonify_baseline.sh

      - name: Test core with Android extended tags
        working-directory: etonify-core
        env:
          LIBBOX_BUILD_TAGS: ${{ steps.android_build.outputs.tags }}
        run: go test -ldflags "$(cat release/LDFLAGS)" -tags "$LIBBOX_BUILD_TAGS" ./...

      - name: Build libbox and sources
        working-directory: etonify-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make lib_android
          test -s libbox.aar
          test -s libbox-sources.jar
          unzip -tqq libbox.aar
          unzip -tqq libbox-sources.jar

      - name: Replace bundled libbox artifacts
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          CORE_VERSION: ${{ steps.core_metadata.outputs.version }}
          CORE_COMMIT: ${{ steps.core_metadata.outputs.commit }}
          LIBBOX_ANDROID_API: ${{ steps.android_build.outputs.android_api }}
          LIBBOX_BUILD_TAGS: ${{ steps.android_build.outputs.tags }}
        run: |
          set -euo pipefail

          libs="android/app/libs"
          mkdir -p "$libs"
          cp etonify-core/libbox.aar "$libs/libbox.aar"
          cp etonify-core/libbox-sources.jar "$libs/libbox-sources.jar"
          (
            cd "$libs"
            sha256sum libbox.aar > libbox.sha256
          )

          gomobile_binary="$(go env GOPATH)/bin/gomobile"
          gomobile_version="$(
            go version -m "$gomobile_binary" |
              awk '$1 == "mod" && $2 == "github.com/sagernet/gomobile" { print $3; exit }'
          )"
          test -n "$gomobile_version"

          ndk_revision="$(
            awk -F= '$1 ~ /^Pkg\.Revision[[:space:]]*$/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              print $2
            }' "$ANDROID_NDK_HOME/source.properties"
          )"
          test -n "$ndk_revision"

          export LIBBOX_SHA256="$(sha256sum "$libs/libbox.aar" | awk '{print $1}')"
          export LIBBOX_SOURCES_SHA256="$(
            sha256sum "$libs/libbox-sources.jar" | awk '{print $1}'
          )"
          export CORE_VERSION CORE_COMMIT
          export CORE_REPOSITORY CORE_BRANCH
          export LIBBOX_ANDROID_API LIBBOX_BUILD_TAGS
          export GOMOBILE_ACTUAL="$gomobile_version"
          export GO_ACTUAL="$(go version)"
          export JAVA_ACTUAL="$(java --version 2>&1 | head -n 1)"
          export ANDROID_NDK_ACTUAL="$ndk_revision"
          export ANDROID_NDK_REQUESTED="$ANDROID_NDK_VERSION"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema_version": 2,
              "artifact": "libbox.aar",
              "sha256": os.environ["LIBBOX_SHA256"],
              "sources_sha256": os.environ["LIBBOX_SOURCES_SHA256"],
              "core_version": os.environ["CORE_VERSION"],
              "source_repository": os.environ["CORE_REPOSITORY"],
              "source_branch": os.environ["CORE_BRANCH"],
              "source_commit": os.environ["CORE_COMMIT"],
              "go": os.environ["GO_ACTUAL"],
              "gomobile": os.environ["GOMOBILE_ACTUAL"],
              "java": os.environ["JAVA_ACTUAL"],
              "android_ndk": os.environ["ANDROID_NDK_ACTUAL"],
              "android_ndk_requested": os.environ["ANDROID_NDK_REQUESTED"],
              "android_api": int(os.environ["LIBBOX_ANDROID_API"]),
              "build_tags": os.environ["LIBBOX_BUILD_TAGS"],
          }
          Path("android/app/libs/libbox.provenance.json").write_text(
              json.dumps(
                  provenance,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify bundled artifacts
        run: |
          python3 scripts/verify_extended_core.py
          python3 scripts/verify_libbox.py

      - name: Upload built libbox for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etonify-libbox-${{ steps.core_metadata.outputs.artifact_version }}-${{ github.run_number }}
          path: |
            android/app/libs/libbox.aar
            android/app/libs/libbox.provenance.json
            android/app/libs/libbox.sha256
            android/app/libs/libbox-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified core update
        shell: bash
        env:
          CORE_VERSION: ${{ steps.core_metadata.outputs.version }}
        run: |
          set -euo pipefail
          git lfs install --local
          aar_filter="$(
            git check-attr filter -- android/app/libs/libbox.aar |
              awk -F': ' '{ print $3 }'
          )"
          if [ "$aar_filter" != "lfs" ]; then
            echo "::error title=Missing Git LFS rule::android/app/libs/libbox.aar must use the lfs filter"
            exit 1
          fi

          git add \
            android/app/libs/libbox.aar \
            android/app/libs/libbox.provenance.json \
            android/app/libs/libbox.sha256 \
            android/app/libs/libbox-sources.jar

          if git diff --cached --quiet; then
            echo "Bundled libbox is already up to date."
            exit 0
          fi

          allowed_files="$(printf '%s\n' \
            android/app/libs/libbox.aar \
            android/app/libs/libbox.provenance.json \
            android/app/libs/libbox.sha256 \
            android/app/libs/libbox-sources.jar | sort)"
          unexpected_files="$(comm -23 \
            <(git diff --cached --name-only | sort) \
            <(printf '%s\n' "$allowed_files"))"
          if [ -n "$unexpected_files" ]; then
            echo "::error title=Unexpected files staged::The workflow may only update the four bundled libbox artifacts."
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(core): update extended libbox to ${CORE_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch client checks for committed AAR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(
            python3 -c \
              'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"]}))'
          )"
          for workflow in ci.yml codeql.yml; do
            curl --fail-with-body --silent --show-error --location \
              --retry 3 \
              --retry-all-errors \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data "$payload"
          done
